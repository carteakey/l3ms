name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select pinned toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
      - name: List the imported stack without starting a runtime
        run: cargo run --offline --locked -- --list stack
      - name: Check Python downloader syntax
        run: python3 -m compileall -q model_downloader
      - name: Test Python downloader boundary
        run: python3 -m unittest discover -s model_downloader -p 'test_*.py'
