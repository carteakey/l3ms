name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select pinned toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
      - name: List the imported stack without starting a runtime
        run: cargo run --offline --locked -- --list stack
      - name: Check Python syntax
        run: python3 -m compileall -q model_downloader media-models decision-models maintenance
      - name: Test Python downloader boundary
        run: python3 -m unittest discover -s model_downloader -p 'test_*.py'
      - name: Test media wrappers and workflows
        run: |
          python3 -m unittest discover -s media-models -p 'test_*.py'
          python3 -m unittest discover -s maintenance -p 'test_*.py'
      - name: Test decision runner and benchmark wrapper (fail-closed, offline)
        run: python3 -m unittest discover -s decision-models -p 'test_*.py'
      - name: Check bounded acceptance harness without services or models
        run: python3 maintenance/probe-breeze-acceptance.py --self-test
      - name: Check shell syntax
        run: |
          for script in media-models/*.sh maintenance/*.sh; do
            bash -n "$script"
          done
