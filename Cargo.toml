[package]
name = "l3ms"
version = "1.0.0"
edition = "2021"
description = "Keyboard-first terminal toolkit for homelab LLM workflows"
license = "MIT"
repository = "https://github.com/carteakey/l3ms"
rust-version = "1.97.1"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
tokio = { version = "1", features = ["rt", "time"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
