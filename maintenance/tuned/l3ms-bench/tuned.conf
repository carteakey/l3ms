# L3MS bench profile - Intel HWP (i5-12600K, intel_pstate active, HWP enabled).
#
# Installed by maintenance/cpu-power-state.sh to /etc/tuned/l3ms-bench/tuned.conf.
# The [cpu] block is upstream tuned's throughput-performance CPU block, read from
# redhat-performance/tuned profiles/throughput-performance/tuned.conf on 2026-10-29:
#
#     governor=performance
#     energy_perf_bias=performance
#     min_perf_pct=100
#     energy_performance_preference=performance
#     boost=1
#
# Why min_perf_pct=100 matters on this box: with the default governor (powersave = the
# intel_cpufreq HWP governor) intel_pstate keeps min_perf_pct=17, so the cores ramp up
# under a bench load instead of starting at max.  Every t/s row recorded in this repo so
# far was measured in that ramping state.  docs/bench-troubleshooting.md has the earlier
# version of this hunt (32-35 t/s against ~39-40 t/s with all sysfs checks reading fine).
#
# Upstream also writes [acpi] platform_profile=performance.  This firmware does not
# expose /sys/firmware/acpi/platform_profile (checked 2026-10-29: only pm_profile is
# there), so the line is left out rather than failing the profile.

[main]
summary=L3MS bench state: governor performance, EPP performance, HWP floor pinned at 100%

[cpu]
governor=performance
energy_perf_bias=performance
min_perf_pct=100
energy_performance_preference=performance
boost=1

[vm]
# Matches the state every recorded bench row here was measured in (THP reads
# "[always] madvise never").  The Strata expert arena is pinned with cudaHostRegister on
# 4 KB pages (vm.nr_hugepages=0), so this line is about not drifting from the measured
# baseline, not about THP helping the arena.
transparent_hugepages=always
