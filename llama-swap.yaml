  "qwen38-flash-next":
    name: "Qwen3.8-Flash-Next (master b78a39a2f, AtomicChat AD-4.27bpw, ngram-on-SSD)"
    description: "Gold: plain upstream master b78a39a2f, conservative. 19.35 t/s fresh decode (up to 19.6 t/s code), pp=300-385 t/s @ ub 2048, 64k ctx, q8 KV, ngram-mod spec. Reasoning capped: effort=medium, budget=4000. See docs/qwen38-flash-next-internal.md."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    cmd: |
      taskset -c ${cpu_range} ${qwen38_master_server}
      -m /home/kchauhan/models/qwen38-flash-next/AD-4.27bpw-Q4_K_M-M64/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-00001-of-00033.gguf
      --alias Qwen3.8-Flash-Next
      --fit on --fit-target 512
      -c 65536 --parallel 1
      -b 4096 -ub 2048
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 60 --spec-ngram-mod-n-min 12 --spec-ngram-mod-n-max 24
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort medium --reasoning-budget 4000 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${PORT}

  "qwen38-flash-next-exp":
    name: "Qwen3.8-Flash-Next EXP (master + #28023 #28068 #27941, AtomicChat AD-4.27bpw)"
    description: "Experimental tier: exp stack e1748dbd5 — GDN l2norm correctness (#28068), indexer heads fix (#28023), kvu NaN-collapse/restore fixes (#27941). Same flags as gold for A/B; outputs may differ slightly via #28068. A/B harness: bench-models/bench-llama-qwen38-flash-next-build-ab.sh."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    cmd: |
      taskset -c ${cpu_range} ${qwen38_exp_server}
      -m /home/kchauhan/models/qwen38-flash-next/AD-4.27bpw-Q4_K_M-M64/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-00001-of-00033.gguf
      --alias Qwen3.8-Flash-Next-Exp
      --fit on --fit-target 512
      -c 65536 --parallel 1
      -b 4096 -ub 1024
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 60 --spec-ngram-mod-n-min 12 --spec-ngram-mod-n-max 24
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort medium --reasoning-budget 4000 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${PORT}

