# ===========================================================================
# Residency Groups
# Co-resident CPU/E-core utilities run alongside whatever burst model occupies
# the RTX 4070; all other profiles stay in llama-swap's default exclusive group.
# ===========================================================================
groups:
  co-resident:
    swap: false
    exclusive: false
    members:
      - "embeddinggemma-2"

# ===========================================================================
# Startup: preload the default so the first request is instant.
# qwen38-flash-next-plat is the default — Platinum Strata Lean tier with
# dynamic expert VRAM cache, native MTP, K8V4 KV, and 73.0 t/s steady decode.
# ===========================================================================
hooks:
  on_startup:
    preload:
      - "qwen38-flash-next-plat"
