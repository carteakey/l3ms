  # ===========================================================================

  "qwen38-flash-next-mtp":
    name: "Qwen3.8-Flash-Next MTP (PR #28243 on master, shared-Q4_K_M, ncmoe 45)"
    description: "Speculative tier: PR #28243 (Daniel Han upstream PR, commit d1a92352c on master b78a39a2f) with unsloth mtp-Qwen3.8-Flash-Next-shared-Q4_K_M.gguf (1.78 GB). Offloads 3 MoE layers to GPU (-ncmoe 45), 20.65 t/s aggregate across tasks (up to 21.9-22.4 t/s on SQL/code), 11.78 GB VRAM. See docs/qwen38-flash-next-internal.md."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    cmd: |
      taskset -c ${cpu_range} ${qwen38_mtp_server}
      -m /home/kchauhan/models/qwen38-flash-next/AD-4.27bpw-Q4_K_M-M64/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-00001-of-00033.gguf
      --spec-draft-model /home/kchauhan/models/unsloth/Qwen3.8-Flash-Next-GGUF/MTP/mtp-Qwen3.8-Flash-Next-shared-Q4_K_M.gguf
      --alias Qwen3.8-Flash-Next-MTP
      -ngl 99 -ncmoe 45
      -c 16384 --parallel 1
      -b 2048 -ub 512
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-p-min 0.7
      --spec-draft-ngl 99
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort medium --reasoning-budget 4000 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${PORT}

