# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# L3MS llama-swap configuration
# -----------------------------
# Single source of truth for serving. Replaces run-models/*.sh.
# See configuration.md (in-repo) for schema reference.
#
# ${env.L3MS_ROOT} must point at the repo root on the serving host
# (e.g. /home/kchauhan/repos/l3ms on the Linux box). llama-swap evaluates
# env macros before config load; startup fails loudly if it is unset.

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"

healthCheckTimeout: 500
logLevel: info
logToStdout: both

# upstream ${PORT} auto-increments from here; llama-swap itself listens on 8080
startPort: 10001

# globalTTL: auto-unload idle models after 10 minutes to free VRAM. Override
# per-model with ttl: 0 to pin.
globalTTL: 600

sendLoadingState: true

macros:
  # --- binary paths ---
  "llama_server":  "${env.L3MS_ROOT}/vendor/llama.cpp/build/bin/llama-server"
  "ik_server":     "${env.L3MS_ROOT}/vendor/ik_llama.cpp/build/bin/llama-server"
  "puzzle_server": "${env.L3MS_ROOT}/vendor/llama.cpp-pr-test-21032/build/bin/llama-server"
  "sarvam_server":  "${env.L3MS_ROOT}/vendor/llama.cpp-pr-test-20275/build/bin/llama-server"
  # qwen3.8 flash-next tiers: master (gold) / MTP (PR #28243 on master) / exp (#29887 MoE LRU cache)
  "qwen38_master_server":  "${env.L3MS_ROOT}/vendor/llama.cpp-master/build/bin/llama-server"
  "qwen38_mtp_server":     "${env.L3MS_ROOT}/vendor/llama.cpp-exp-stack-v2/build/bin/llama-server"
  "qwen38_exp_server":     "${env.L3MS_ROOT}/vendor/llama.cpp-exp-latest/build/bin/llama-server"
  "qwen38_exp_mtp_server": "${env.L3MS_ROOT}/vendor/llama.cpp-pr-test-28023-28068-27941/build/bin/llama-server"
  # decision models: master @ efe3626b1 (#30383 vllm-d3 support), worktree of llama.cpp-master
  "d3_server":             "${env.L3MS_ROOT}/vendor/llama.cpp-d3/build/bin/llama-server"
  # strata tier: 4070-main-lite (carteakey/Strata) dynamic expert cache + native MTP + fused hyper-connections + Q8_0 PLE table
  "strata_python":         "${env.L3MS_ROOT}/vendor/strata/.venv/bin/python"
  "strata_server":         "${env.L3MS_ROOT}/vendor/strata-lean/serve/server.py"
  "strata_iq3_config":     "${env.L3MS_ROOT}/vendor/strata-lean/strata-iq3_xxs-ple_q8.json"
  "strata_abliterated_config": "${env.L3MS_ROOT}/vendor/strata-lean/strata-sc117-iq3_xxs-ple_q8.json"
  "strata_vision_config":  "${env.L3MS_ROOT}/vendor/strata-lean/strata-vision-ple_q8.json"
  "strata_vision_iq4_config": "${env.L3MS_ROOT}/vendor/strata-lean/strata-vision.json"
  "strata_abliterated_vision_config": "${env.L3MS_ROOT}/vendor/strata-lean/strata-sc117-vision-ple_q8.json"
  "strata_iq3s_config":    "${env.L3MS_ROOT}/vendor/strata/strata-iq3_s.json"
  "strata_ple_q8_config":  "${env.L3MS_ROOT}/vendor/strata-lean/strata-iq3_xxs-ple_q8.json"
  # humanizer: master binary with full Gemma 4 support & jinja chat template
  "humanizer_server":      "${env.L3MS_ROOT}/vendor/llama.cpp-master/build/bin/llama-server"

  # media engines owned by llama-swap (reserved model ids audiocpp_auto / comfyui_auto)
  "audiocpp_server":       "${env.L3MS_ROOT}/vendor/audio.cpp-955c872/build/bin/audiocpp_server"
  "comfy_root":            "${env.L3MS_ROOT}"

  # --- shared paths ---
  "chat_template": "${env.L3MS_ROOT}/chat-template.jinja"

  # --- taskset wrapper (empty if CPU_RANGE unset) ---
  "cpu_range": "0-11"

models:

  # Native typed decisions, not chat. POST /v1/systemone with model (swap v262+).
  "vllm-d3-flash":
    name: "vLLM-SR d3-flash 9B Decision (Q8_0 + mmproj-BF16, text+image)"
    description: "Native decision model: choice / noul (yes-no) / score questions answered with probabilities via POST /v1/systemone (TypeSafe System One API). Image input via `images` data URLs (up to 1.6 MP each). Non-causal: whole prompt (images + state + question) must fit one ubatch, so ub = ctx = 8192 (~4 full-size images). 11.5 GB VRAM. Warm: ~0.11 s text (3 questions), ~1.7 s with one 1024x768 image + 4 questions (each question re-reads the image: 3.4k tokens)."
    metadata:
      task: decision
    cmd: |
      taskset -c ${cpu_range} ${d3_server}
      -m /home/kchauhan/models/ggml-org/vllm-d3-flash-GGUF/vllm-d3-flash-Q8_0.gguf
      --mmproj /home/kchauhan/models/ggml-org/vllm-d3-flash-GGUF/mmproj-vllm-d3-flash-BF16.gguf
      --alias vllm-d3-flash
      -ngl 99 -fa on
      -c 8192 --parallel 1
      -b 8192 -ub 8192
      -t 10 --threads-batch 12 --prio 2
      --host 0.0.0.0 --port ${PORT}

  "cloudflare-clef-flash":
    name: "Cloudflare Clef-Flash 9B Decision (Q4_K_M + mmproj-BF16, text+image)"
    description: "Native decision model (clef): all questions of a request decided jointly in one pass, so images are read once. POST /v1/systemone with the model in the JSON body. Clef server is decision-only (no text generation). Whole prompt must fit one ubatch: ub = ctx = 8192. 8.9 GB VRAM. Warm: ~0.09 s text (3 questions), ~0.5 s with one 1024x768 image + 4 questions (1.1k tokens)."
    metadata:
      task: decision
    cmd: |
      taskset -c ${cpu_range} ${d3_server}
      -m /home/kchauhan/models/ggml-org/Clef-Flash-GGUF/Clef-Flash-Q4_K_M.gguf
      --mmproj /home/kchauhan/models/ggml-org/Clef-Flash-GGUF/mmproj-Clef-Flash-BF16.gguf
      --alias cloudflare-clef-flash
      -ngl 99 -fa on
      -c 8192 --parallel 1
      -b 8192 -ub 8192
      -t 10 --threads-batch 12 --prio 2
      --host 0.0.0.0 --port ${PORT}

  # ===========================================================================
  # Media engines. llama-swap swaps these like any model: /audiocpp/ and
  # /comfyui/ route to the reserved ids. See docs/migration/media-through-llama-swap.md.
  # ===========================================================================

  "audiocpp_auto":
    name: "audio.cpp (Breeze TTS · HeartMuLa · MiniMax H3 audio)"
    description: "Shared CUDA audio engine. Breeze standard/design, clone and streaming use /audiocpp/v1/audio/speech; HeartMuLa music and H3 audio use /audiocpp/v1/tasks/run. Model ids and weights are configured in audiocpp-server.json."
    cmd: >-
      ${audiocpp_server} --config ${env.L3MS_ROOT}/audiocpp-server.json
      --host 127.0.0.1 --port ${PORT} --no-ui
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health

  "comfyui_auto":
    name: "ComfyUI (images · LTX video · YuE2 music)"
    description: "ComfyUI via /comfyui/. Low-VRAM flags; job submit, status, cancel and artifact routes are used by the l2m2 adapter."
    cmd: >-
      /usr/bin/bash -c 'cd ${comfy_root}/vendor/ComfyUI &&
      exec ${comfy_root}/.venv-comfy/bin/python ${comfy_root}/vendor/ComfyUI/main.py
      --listen 127.0.0.1 --port ${PORT} --disable-auto-launch --disable-api-nodes
      --lowvram --reserve-vram 1.0
      --user-directory ${comfy_root}/.toolkit/comfyui/user
      --output-directory ${env.HOME}/media-output/comfyui'
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /system_stats

