# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# L3MS llama-swap configuration
# -----------------------------
# Single source of truth for serving. Replaces run-models/*.sh.
# See configuration.md (in-repo) for schema reference.
#
# ${env.L3MS_ROOT} must point at the repo root on the serving host
# (e.g. /home/kchauhan/repos/l3ms on the Linux box). llama-swap evaluates
# env macros before config load; startup fails loudly if it is unset.

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"

healthCheckTimeout: 500
logLevel: info
logToStdout: both

# upstream ${PORT} auto-increments from here; llama-swap itself listens on 8080
startPort: 10001

# globalTTL: auto-unload idle models after 10 minutes to free VRAM. Override
# per-model with ttl: 0 to pin.
globalTTL: 600

sendLoadingState: true

macros:
  "inference_port":        "8089"
  # --- binary paths ---
  "llama_server":          "${env.L3MS_ROOT}/vendor/llama.cpp/build/bin/llama-server"
  # qwen3.8 flash-next tiers: master (gold) / MTP (PR #28243 on master) / exp (#30966 MoE LRU cache)
  "qwen38_master_server":  "${env.L3MS_ROOT}/vendor/llama.cpp-master/build/bin/llama-server"
  "qwen38_mtp_server":     "${env.L3MS_ROOT}/vendor/llama.cpp-exp-stack-v2/build/bin/llama-server"
  "qwen38_exp_server":     "${env.L3MS_ROOT}/vendor/llama.cpp-exp-latest/build/bin/llama-server"
  # decision models: master @ efe3626b1 (#30383 vllm-d3 support), worktree of llama.cpp-master
  "d3_server":             "${env.L3MS_ROOT}/vendor/llama.cpp-d3/build/bin/llama-server"
  # strata tier: carteakey/strata-lean dynamic expert cache + native MTP + fused hyper-connections + Q8_0 PLE table
  "strata_python":         "${env.L3MS_ROOT}/vendor/strata/.venv/bin/python"
  "strata_server":         "${env.L3MS_ROOT}/vendor/strata-lean/serve/server.py"
  "strata_ud_iq2_config":  "${env.L3MS_ROOT}/vendor/strata-lean/strata-ud-iq2_xs-ple_q8.json"
  "strata_abliterated_config":        "${env.L3MS_ROOT}/vendor/strata-lean/strata-sc117-iq3_xxs-ple_q8.json"
  "strata_vision_config":             "${env.L3MS_ROOT}/vendor/strata-lean/strata-vision-ple_q8.json"
  "strata_abliterated_vision_config": "${env.L3MS_ROOT}/vendor/strata-lean/strata-sc117-vision-ple_q8.json"
  # humanizer: master binary with full Gemma 4 support & jinja chat template
  "humanizer_server":      "${env.L3MS_ROOT}/vendor/llama.cpp-master/build/bin/llama-server"
  # master binary (b12621+): Nemotron 3.5 Bolt (nemotron_h_moe + DFlash) & general latest mainline models
  "llama_master_server":   "${env.L3MS_ROOT}/vendor/llama.cpp-master/build/bin/llama-server"
  # inkling2: custom lean Ada sm_89 llama.cpp build (fallback) + PolyStrata strata-poly (primary, 256k elastic)
  "inkling2_server":            "${env.L3MS_ROOT}/vendor/llama.cpp-inkling2-lean/build/bin/llama-server"
  "polystrata_server":          "${env.L3MS_ROOT}/vendor/polystrata/terminal/serve/server.py"
  "polystrata_inkling2_config": "${env.L3MS_ROOT}/vendor/polystrata/polystrata-inkling2-256k.json"

  # media engines owned by llama-swap (reserved model ids audiocpp_auto / comfyui_auto)
  "audiocpp_server":       "${env.L3MS_ROOT}/vendor/audio.cpp-v0.9.6/build/bin/audiocpp_server"
  "acestep_server":        "${env.L3MS_ROOT}/vendor/acestep.cpp/build/ace-server"
  "speech_cpp_server":     "${env.HOME}/.local/share/lytte-nemotron/runtime/speech"
  "comfy_root":            "${env.L3MS_ROOT}"

  # --- Alder Lake CPU pinning (i5-12600K: 6P/12T on 0-11, 4E on 12-15) ---
  "cpu_range": "0-11"
  "ecores":    "12-15"

models:

  # ===========================================================================
  # Co-Resident CPU/E-Core Utilities
  # Runs alongside whatever burst model occupies the RTX 4070 without evicting it.
  # ===========================================================================

  "embeddinggemma-2":
    name: "EmbeddingGemma 2 (CPU Embeddings)"
    description: "Always-on semantic search embeddings (768-dim) on CPU E-cores. Zero VRAM, never evicts your active GPU model."
    ttl: 300
    metadata:
      task: embeddings
      dimensions: 768
      context_length: 2048
      query_prefix: "task: search result | query: "
      document_prefix: "title: none | text: "
    cmd: |
      env CUDA_VISIBLE_DEVICES= taskset -c ${ecores} ${qwen38_master_server}
      -m /home/kchauhan/models/ggml-org/embeddinggemma-2-GGUF/embeddinggemma-2-Q8_0.gguf
      --alias embeddinggemma-2
      --embedding
      --ctx-size 2048
      --batch-size 2048 --ubatch-size 2048
      --n-gpu-layers 0
      --parallel 2
      --threads 4
      --host 0.0.0.0 --port ${PORT}
      --no-warmup

  "liquid-d1-2b":
    name: "LiquidAI d1-2B (CPU Triage)"
    description: "Always-on 2B structured decision router (/v1/systemone) on CPU E-cores. Zero VRAM, never evicts your active GPU model."
    aliases:
      - "d1-2b"
      - "lfm3-d1"
    ttl: 1800
    metadata:
      task: decision
    cmd: |
      env CUDA_VISIBLE_DEVICES= taskset -c ${ecores} ${llama_master_server}
      -m /home/kchauhan/models/liquid/d1-2B-GGUF/d1-2B-Q8_0.gguf
      --mmproj /home/kchauhan/models/liquid/d1-2B-GGUF/mmproj-d1-2B-Q8_0.gguf
      --no-mmproj-offload
      --alias liquid-d1-2b
      -ngl 0
      -c 8192 --parallel 1
      -b 8192 -ub 8192
      -t 4
      --host 0.0.0.0 --port ${PORT}
      --no-warmup

  "kokoro-82m":
    name: "Kokoro 82M (Instant CPU TTS)"
    description: "Always-on multilingual voice synthesis (54 preset voices) on CPU E-cores. Instant speech with zero GPU switchover."
    aliases:
      - "kokoro"
    ttl: 1800
    metadata:
      task: tts
    cmd: >-
      env CUDA_VISIBLE_DEVICES= taskset -c ${ecores}
      ${audiocpp_server} --config ${env.L3MS_ROOT}/audiocpp-kokoro-cpu.json
      --host 127.0.0.1 --port ${PORT} --no-ui
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health

  # ===========================================================================
  # Primary Local Burst — Language & Vision
  # Mutually exclusive on RTX 4070 12 GB (fixed port ${inference_port} = 8089).
  # ===========================================================================

  "qwen38-flash-next-plat":
    name: "Qwen3.8-Flash-Next Plat (Primary · 73 t/s)"
    description: "Startup preload and primary 180B MoE model on Strata Lean. 128k context, 73 t/s decode, up to 1,888 t/s prefill."
    aliases:
      - "strata"
      - "plat"
      - "qwen38-flash-next-plat-ud-iq2"
      - "qwen38-flash-next-plat-ple-q8"
      - "plat-q8"
    ttl: 3600
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${strata_server}
      --engine strata
      --config ${strata_ud_iq2_config}
      --fit-max-tokens
      --host 0.0.0.0
      --port ${inference_port}

  "qwen38-flash-next-plat-vision":
    name: "Qwen3.8-Flash-Next Plat Vision"
    description: "Multimodal Qwen3.8-Flash-Next on Strata Lean with CPU-offloaded image encoding so VRAM stays dedicated to experts."
    aliases:
      - "strata-vision"
      - "plat-vision"
      - "qwen38-flash-next-plat-vision-iq4"
      - "plat-vision-iq4"
    ttl: 3600
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${strata_server}
      --engine strata
      --config ${strata_vision_config}
      --fit-max-tokens
      --host 0.0.0.0
      --port ${inference_port}

  "qwen38-flash-next-plat-abliterated":
    name: "Qwen3.8-Flash-Next Plat Abliterated"
    description: "Uncensored SC117 variant of Qwen3.8-Flash-Next on Strata Lean at 128k context (~62-76 t/s decode)."
    aliases:
      - "abliterated"
    ttl: 3600
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${strata_server}
      --engine strata
      --config ${strata_abliterated_config}
      --fit-max-tokens
      --host 0.0.0.0
      --port ${inference_port}

  "qwen38-flash-next-plat-abliterated-vision":
    name: "Qwen3.8-Flash-Next Plat Abliterated Vision"
    description: "Uncensored SC117 Qwen3.8-Flash-Next on Strata Lean with CPU-offloaded multimodal image understanding."
    aliases:
      - "abliterated-vision"
    ttl: 3600
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${strata_server}
      --engine strata
      --config ${strata_abliterated_vision_config}
      --fit-max-tokens
      --host 0.0.0.0
      --port ${inference_port}

  "inkling-2-mini":
    name: "Inkling 2 Mini (Coding + Vision · 78/100 t/s)"
    description: "Primary fast coding, agentic, and vision MoE on PolyStrata. 256k context, 77.5 t/s fresh, 99.7 t/s edits, 2,296 t/s prefill."
    aliases:
      - "inkling-2-mini-128k"
    ttl: 3600
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${polystrata_server}
      --engine strata
      --config ${polystrata_inkling2_config}
      --fit-max-tokens
      --host 0.0.0.0
      --port ${inference_port}

  "qwen3-8-27b-iq3-xxs":
    name: "Qwen3.8-27B (Pure VRAM · 37 t/s)"
    description: "Dense 27B model fitting 100% inside 12 GB VRAM with 262k context and zero RAM spill (~36.7 t/s)."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${llama_server}
      -m /home/kchauhan/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --alias "unsloth/Qwen3.8-27B UD-IQ3_XXS"
      --temp 1.0 --top-p 0.95 --top-k 20
      --presence-penalty 0.0 --repeat-penalty 1.0
      --host 0.0.0.0 --port ${inference_port}
      --jinja
      --ctx-size 262144 --n-predict 32768
      --fit on --fit-ctx 262144 --fit-target 128
      -ctk q5_0 -ctv q4_1
      --load-mode none
      --threads 10 --threads-batch 12
      --flash-attn on
      --parallel 1
      --batch-size 512 --ubatch-size 512
      --prio 2 --no-warmup

  # ===========================================================================
  # Fallback & Specialized Local LLMs
  # ===========================================================================

  "qwen38-flash-next":
    name: "Qwen3.8-Flash-Next (llama.cpp Fallback)"
    description: "Upstream llama.cpp fallback for Qwen3.8-Flash-Next at 96k context (~23 t/s decode)."
    aliases:
      - "qwen38-flash-next-ple-q8"
      - "gold-q8"
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${qwen38_master_server}
      -m /home/kchauhan/models/unsloth/UD-IQ2_XS/Qwen3.8-Flash-Next-UD-IQ2_XS-00001-of-00003.gguf
      --alias Qwen3.8-Flash-Next
      --fit on --fit-target 512
      -c 98304 --parallel 1
      -b 4096 -ub 2048
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 60 --spec-ngram-mod-n-min 12 --spec-ngram-mod-n-max 24
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort xhigh --reasoning-budget -1 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "qwen38-flash-next-exp":
    name: "Qwen3.8-Flash-Next (llama.cpp MoE Cache)"
    description: "Experimental llama.cpp fallback with GPU MoE expert caching at 65k context (~25 t/s decode)."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${qwen38_exp_server}
      -m /home/kchauhan/models/unsloth/UD-IQ2_XS/Qwen3.8-Flash-Next-UD-IQ2_XS-00001-of-00003.gguf
      --alias Qwen3.8-Flash-Next-Exp
      --fit on --fit-target 512
      -c 65536 --parallel 1
      -b 4096 -ub 1024
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --moe-cache-mib 2048
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 60 --spec-ngram-mod-n-min 12 --spec-ngram-mod-n-max 24
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort xhigh --reasoning-budget 4000 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "qwen38-flash-next-mtp":
    name: "Qwen3.8-Flash-Next (llama.cpp MTP)"
    description: "Speculative-decoding llama.cpp fallback using a shared MTP draft head (~21-27 t/s decode)."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${qwen38_mtp_server}
      -m /home/kchauhan/models/unsloth/UD-IQ2_XS/Qwen3.8-Flash-Next-UD-IQ2_XS-00001-of-00003.gguf
      --spec-draft-model /home/kchauhan/models/unsloth/Qwen3.8-Flash-Next-GGUF/MTP/mtp-Qwen3.8-Flash-Next-shared-Q4_K_M.gguf
      --alias Qwen3.8-Flash-Next-MTP
      -ngl 99 -ncmoe 46
      -c 16384 --parallel 1
      -b 2048 -ub 512
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-p-min 0.7
      --spec-draft-ngl 99
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort xhigh --reasoning-budget -1 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "qwen38-flash-next-vision":
    name: "Qwen3.8-Flash-Next Vision (llama.cpp Fallback)"
    description: "Multimodal upstream llama.cpp fallback with vision support at 32k context (~18 t/s decode)."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${qwen38_master_server}
      -m /home/kchauhan/models/unsloth/UD-IQ2_XS/Qwen3.8-Flash-Next-UD-IQ2_XS-00001-of-00003.gguf
      --mmproj /home/kchauhan/models/unsloth/Qwen3.8-Flash-Next-GGUF/mmproj-F16.gguf
      --alias Qwen3.8-Flash-Next-Vision
      -ngl 99 -ncmoe 45
      -c 32768 --parallel 1
      -b 2048 -ub 1024
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort xhigh --reasoning-budget 4000 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "inkling-2-mini-llama":
    name: "Inkling 2 Mini (llama.cpp Fallback · 69 t/s)"
    description: "GGUF fallback for Inkling 2 Mini with MoE caching, DSpark drafting, and CPU vision at 32k context (~68.7 t/s)."
    env:
      - "LLAMA_MOE_CACHE_ELASTIC=1"
      - "LLAMA_MOE_CACHE_VISIT_BUDGET=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${inkling2_server}
      -m /mnt/dev/models/unsloth/Inkling-2-Mini-GGUF/Inkling-2-Mini-UD-Q4_K_XL.gguf
      --mmproj /mnt/dev/models/unsloth/Inkling-2-Mini-GGUF/mmproj-F16.gguf
      --no-mmproj-offload
      --spec-draft-model /mnt/dev/models/unsloth/Inkling-2-Mini-GGUF/dspark-Inkling-2-Mini-Q8_0.gguf
      --spec-type draft-dspark --spec-draft-n-max 3 --spec-draft-ngl 99 --spec-draft-n-ubatch 256
      --alias inkling-2-mini-llama
      --jinja --flash-attn on
      -c 32768 --parallel 1
      -ngl 99 --fit off --load-mode none
      -cmoe --moe-cache-mib 7800 --moe-cache-cpu-share 0.70
      -ot "token_embd\.weight=CPU"
      -ctk q8_0 -ctv q8_0
      --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0.0
      --batch-size 2048 --ubatch-size 2048
      --threads 12 --threads-batch 12 --prio 2
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  # Inkling 2 Mini 26.4B-A5.4B — Unbound v2.1 (abliterated; non-startup profile).
  # Sampling per model card: temp 0.6 / top_p 0.95 (thinking cap 4,096 is client-side max_tokens). No DRY.
  "inkling-2-mini-unbound-v2.1":
    name: "Inkling 2 Mini Unbound v2.1"
    description: "Abliterated Unbound v2.1 variant of Inkling 2 Mini with vision support at 32k context (unmeasured)."
    env:
      - "LLAMA_MOE_CACHE_ELASTIC=1"
      - "LLAMA_MOE_CACHE_VISIT_BUDGET=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${inkling2_server}
      -m /mnt/dev/models/nokeepai/Inkling-2-Mini-Unbound-GGUF/Inkling-2-Mini-Unbound-v2.1-Q4_K_M.gguf
      --mmproj /mnt/dev/models/unsloth/Inkling-2-Mini-GGUF/mmproj-F16.gguf
      --no-mmproj-offload
      --alias inkling-2-mini-unbound-v2.1
      --jinja --flash-attn on
      -c 32768 --parallel 1
      -ngl 99 --fit off --load-mode none
      -cmoe --moe-cache-mib 7800 --moe-cache-cpu-share 0.70
      -ot "token_embd\.weight=CPU"
      -ctk q8_0 -ctv q8_0
      --temp 0.6 --top-p 0.95 --top-k 0 --min-p 0.0
      --batch-size 2048 --ubatch-size 2048
      --threads 12 --threads-batch 12 --prio 2
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "gemma-4-26b-qat":
    name: "Gemma 4 26B QAT (69 t/s)"
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    description: "Fast 26B QAT MoE model for general chat and writing at 128k context (~69 t/s decode)."
    cmd: |
      taskset -c ${cpu_range} ${llama_server}
      -m /home/kchauhan/models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --alias "unsloth/gemma-4-26B-A4B QAT (UD-Q4_K_XL)"
      --seed 3407
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0 --repeat-penalty 1.0
      --host 0.0.0.0 --port ${inference_port}
      --jinja
      --ctx-size 131072
      --fit on --fit-ctx 131072 --fit-target 512
      --parallel 1
      -ctk q8_0 -ctv q8_0
      --load-mode mlock
      --threads 10 --threads-batch 12 --flash-attn on
      --batch-size 1024 --ubatch-size 512
      --prio 2 --no-warmup

  "gemma-4-26b-qat-mtp":
    name: "Gemma 4 26B QAT + MTP (101 t/s)"
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    description: "Fastest speculative-decoding Gemma 4 profile on this GPU at 128k context (~100.6 t/s decode)."
    cmd: |
      taskset -c ${cpu_range} ${llama_server}
      -m /home/kchauhan/models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --spec-draft-model /home/kchauhan/models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/mtp-gemma-4-26B-A4B-it.gguf
      --alias "unsloth/gemma-4-26B-A4B QAT + MTP"
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.00
      --presence-penalty 0.0 --repeat-penalty 1.0
      --host 0.0.0.0 --port ${inference_port}
      --jinja
      --chat-template-kwargs '{"preserve_thinking": true}'
      --ctx-size 131072 --n-predict 32768
      --fit on --fit-ctx 131072 --fit-target 1536
      -ctk f16 -ctv f16
      --load-mode mlock
      --threads 10 --threads-batch 12
      --flash-attn on
      --spec-type draft-mtp --spec-draft-n-max 2
      --parallel 1
      --batch-size 1024 --ubatch-size 512
      --prio 2 --no-warmup

  "humanizer-12b":
    name: "Humanizer 12B (Rewrite · 29 t/s)"
    description: "Fine-tuned Gemma 4 12B rewriter that turns AI drafts into natural prose while preserving facts and numbers."
    aliases:
      - "humanizer"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${humanizer_server}
      -m /home/kchauhan/models/jialinyyzz/humanizer/humanizer-12b-Q6_K.gguf
      --alias humanizer-12b
      -c 8192 --parallel 1
      -ngl 99
      --flash-attn on
      --jinja
      --temp 1.0 --top-p 0.95 --top-k 0 --min-p 0.0 --repeat-penalty 1.0
      --threads 10 --threads-batch 12 --prio 2
      --batch-size 2048 --ubatch-size 512
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "nemotron-3.5-bolt":
    name: "Nemotron 3.5 Bolt 74B (VLM)"
    description: "74B-A9B hybrid multimodal model (text, images, video) with DFlash speculative decoding and RAM offload."
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${llama_master_server}
      -m /mnt/dev/models/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-GGUF/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
      --mmproj /mnt/dev/models/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-GGUF/mmproj-NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB.gguf
      --spec-draft-model /mnt/dev/models/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-GGUF/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr.gguf
      --spec-type draft-dflash --spec-draft-n-max 6 --spec-draft-ngl 99
      --alias nemotron-3.5-bolt
      --jinja --flash-attn on
      -c 65536 --parallel 1
      -ngl 99 --fit on --fit-ctx 65536 --fit-target 1024
      -ctk q8_0 -ctv q8_0
      --temp 1.0 --top-p 0.95
      --batch-size 2048 --ubatch-size 512
      --threads 10 --threads-batch 12 --prio 2
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  # ===========================================================================
  # Media Engines
  # llama-swap swaps these like any burst model: /audiocpp/ and /comfyui/ route
  # to the reserved ids. See docs/migration/media-through-llama-swap.md.
  # ===========================================================================

  "comfyui_auto":
    name: "ComfyUI (Image & Video Studio)"
    description: "GPU image and video workflow server for Qwen-Image-2.1 Turbo, MiniMax-H3-Image Q4_K_M, and FLUX.3 Klein (/comfyui/)."
    cmd: >-
      /usr/bin/bash -c 'cd ${comfy_root}/vendor/ComfyUI &&
      exec ${comfy_root}/.venv-comfy/bin/python ${comfy_root}/vendor/ComfyUI/main.py
      --listen 127.0.0.1 --port ${PORT} --disable-auto-launch --disable-api-nodes
      --lowvram --reserve-vram 1.0
      --user-directory ${comfy_root}/.toolkit/comfyui/user
      --output-directory ${env.HOME}/media-output/comfyui'
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /system_stats

  "audiocpp_auto":
    name: "audio.cpp (Breeze-TTS-2 & Kokoro GPU)"
    description: "Shared GPU speech engine serving Breeze-TTS-2 (TTS, voice clone, voice design, streaming) and Kokoro."
    cmd: >-
      ${audiocpp_server} --config ${env.L3MS_ROOT}/audiocpp-server.json
      --host 127.0.0.1 --port ${PORT} --no-ui
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health

  "ace-step-1.5":
    name: "ACE-Step 1.5 Turbo (Music Generation)"
    description: "Local 48 kHz stereo music generator on GPU (~5.3 GiB VRAM) with built-in WebUI on :8089 and HTTP API."
    aliases:
      - "acestep"
      - "music"
      - "ace-step-1.5-turbo"
    ttl: 600
    metadata:
      task: music
    proxy: http://127.0.0.1:${inference_port}
    checkEndpoint: /health
    cmd: >-
      taskset -c ${cpu_range} ${acestep_server}
      --models /home/kchauhan/models/media/ACE-Step-1.5
      --host 0.0.0.0 --port ${inference_port}

  "nemotron-3.5-transcribe":
    name: "Nemotron 3.5 Transcribe 30B (ASR)"
    description: "Local speech-to-text transcription with voice activity detection and speaker diarization."
    useModelName: "NVIDIA-Nemotron-3.5-Transcribe-30B-A4B"
    unlisted: true
    cmd: >-
      ${speech_cpp_server} serve
      ${env.HOME}/.local/share/lytte-nemotron/models/NVIDIA-Nemotron-3.5-Transcribe-30B-A4B-IQ4_NL.gguf
      silero-vad nemotron-3-diarization --device Vulkan1 --threads 10
      --host 127.0.0.1 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 600

  # ===========================================================================
  # System One Decisions
  # Native typed decisions, not chat. POST /v1/systemone with model (swap v262+).
  # ===========================================================================

  "vllm-d3-27b":
    name: "vLLM-SR d3-27B (High-Precision Decisions)"
    description: "27B structured decision model (/v1/systemone) for RAG grounding and complex multi-label schemas."
    aliases:
      - "d3-27b"
    metadata:
      task: decision
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${llama_master_server}
      -m /home/kchauhan/models/turintech/d3-27B-Artemis-GGUF/d3-27B-Artemis-Q3_K_S.gguf
      --alias vllm-d3-27b
      --fit on --fit-ctx 8192 --fit-target 512
      -fa on
      -ctk q8_0 -ctv q8_0
      -c 8192 --parallel 1
      -b 8192 -ub 8192
      -t 10 --threads-batch 12 --prio 2
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "vllm-d3-flash":
    name: "vLLM-SR d3-flash 9B (Text + Image Decisions)"
    description: "Fast 9B decision model (/v1/systemone) scoring choice, yes/no, and numeric questions with text or image input."
    metadata:
      task: decision
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${d3_server}
      -m /home/kchauhan/models/ggml-org/vllm-d3-flash-GGUF/vllm-d3-flash-Q8_0.gguf
      --mmproj /home/kchauhan/models/ggml-org/vllm-d3-flash-GGUF/mmproj-vllm-d3-flash-BF16.gguf
      --alias vllm-d3-flash
      -ngl 99 -fa on
      -c 8192 --parallel 1
      -b 8192 -ub 8192
      -t 10 --threads-batch 12 --prio 2
      --host 0.0.0.0 --port ${inference_port}

  "cloudflare-clef-flash":
    name: "Cloudflare Clef-Flash 9B (Joint Decisions)"
    description: "Single-pass 9B decision model (/v1/systemone) that scores all questions together (~0.5s with images)."
    metadata:
      task: decision
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${d3_server}
      -m /home/kchauhan/models/ggml-org/Clef-Flash-GGUF/Clef-Flash-Q4_K_M.gguf
      --mmproj /home/kchauhan/models/ggml-org/Clef-Flash-GGUF/mmproj-Clef-Flash-BF16.gguf
      --alias cloudflare-clef-flash
      -ngl 99 -fa on
      -c 8192 --parallel 1
      -b 8192 -ub 8192
      -t 10 --threads-batch 12 --prio 2
      --host 0.0.0.0 --port ${inference_port}

# ===========================================================================
# Residency Groups
# Co-resident CPU/E-core utilities run alongside whatever burst model occupies
# the RTX 4070; all other profiles stay in llama-swap's default exclusive group.
# ===========================================================================
groups:
  co-resident:
    swap: false
    exclusive: false
    members:
      - "embeddinggemma-2"
      - "liquid-d1-2b"
      - "kokoro-82m"

# ===========================================================================
# Startup: preload the default so the first request is instant.
# qwen38-flash-next-plat is the default — Platinum Strata Lean tier with
# dynamic expert VRAM cache, native MTP, K8V4 KV, and 73.0 t/s steady decode.
# ===========================================================================
hooks:
  on_startup:
    preload:
      - "qwen38-flash-next-plat"
