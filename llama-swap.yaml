# Run the CPU-only embedder alongside whatever chat model is loaded instead of
# swapping it out (llama-swap otherwise unloads every other model on a request).
groups:
  embeddings:
    swap: false
    exclusive: false
    members:
      - "embeddinggemma-2"

# ===========================================================================
# Startup: preload the default so the first request is instant.
# qwen38-flash-next-plat is the default — Platinum Strata tier with
# dynamic expert VRAM cache, native MTP, K8V4 KV, and 62-90 tok/s.
# ===========================================================================
hooks:
  on_startup:
    preload:
      - "qwen38-flash-next-plat"
