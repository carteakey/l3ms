  # ===========================================================================

  "comfyui_auto":
    name: "ComfyUI (images · LTX video · YuE2 music)"
    description: "ComfyUI via /comfyui/. Low-VRAM flags; job submit, status, cancel and artifact routes are used by the L3MS media runner."
