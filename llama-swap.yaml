  "qwen38-flash-next-plat":
    name: "Qwen3.8-Flash-Next Plat (Strata v0.1.45, Q8_0 PLE Table, 128k ctx, 75-90 t/s)"
    description: "Platinum: Strata v0.1.45 with dynamic expert VRAM caching (3,086 hot experts in VRAM) + unquantized Q8_0 PLE n-gram table (54.4 GB on NVMe, 0 MiB VRAM overhead) + native MTP speculative decoding (Q2_0 draft head) + K8V4 KV cache + 128k context + 4-slot conversation cache. 74.8 t/s steady decode on real code, 90.2 t/s peak, pp=1,138-2,013 t/s @ 8k. See docs/qwen3-8-flash-next-ple-precision.md."
    ttl: 3600
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${strata_server}
      --engine strata
      --config ${strata_iq3_config}
      --fit-max-tokens
      --port ${PORT}

  "strata":
