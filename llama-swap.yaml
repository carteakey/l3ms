  "embeddinggemma-2":
    name: "EmbeddingGemma 2 (Q8_0, CPU, 768 dimensions)"
    description: "OpenAI-compatible embeddings for Lytte search by meaning. CPU-only so it never evicts a chat model from VRAM; unloads after 5 minutes idle."
    ttl: 300
    metadata:
      task: embeddings
      dimensions: 768
      context_length: 2048
      query_prefix: "task: search result | query: "
      document_prefix: "title: none | text: "
    cmd: |
      env CUDA_VISIBLE_DEVICES= ${qwen38_master_server}
      -m /home/kchauhan/models/ggml-org/embeddinggemma-2-GGUF/embeddinggemma-2-Q8_0.gguf
      --alias embeddinggemma-2
      --embedding
      --ctx-size 2048
      --batch-size 2048 --ubatch-size 2048
      --n-gpu-layers 0
      --parallel 2
      --threads 4
      --host 0.0.0.0 --port ${PORT}
      --no-warmup

