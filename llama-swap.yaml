# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# L3MS llama-swap configuration
# -----------------------------
# Single source of truth for serving. Replaces run-models/*.sh.
# See configuration.md (in-repo) for schema reference.
#
# ${env.L3MS_ROOT} must point at the repo root on the serving host
# (e.g. /home/kchauhan/repos/l3ms on the Linux box). llama-swap evaluates
# env macros before config load; startup fails loudly if it is unset.

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"

healthCheckTimeout: 500
logLevel: info
logToStdout: both

# upstream ${PORT} auto-increments from here; llama-swap itself listens on 8080
startPort: 10001

# globalTTL: auto-unload idle models after 10 minutes to free VRAM. Override
# per-model with ttl: 0 to pin.
globalTTL: 600

sendLoadingState: true

macros:
  "inference_port":        "8089"
  # --- binary paths ---
  "llama_server":          "${env.L3MS_ROOT}/vendor/llama.cpp/build/bin/llama-server"
  # qwen3.8 flash-next tiers: master (gold) / MTP (PR #28243 on master) / exp (#30966 MoE LRU cache)
  "qwen38_master_server":  "${env.L3MS_ROOT}/vendor/llama.cpp-master/build/bin/llama-server"
  "qwen38_mtp_server":     "${env.L3MS_ROOT}/vendor/llama.cpp-exp-stack-v2/build/bin/llama-server"
  "qwen38_exp_server":     "${env.L3MS_ROOT}/vendor/llama.cpp-exp-latest/build/bin/llama-server"
  # decision models: master @ efe3626b1 (#30383 vllm-d3 support), worktree of llama.cpp-master
  "d3_server":             "${env.L3MS_ROOT}/vendor/llama.cpp-d3/build/bin/llama-server"
  # strata tier: carteakey/strata-lean dynamic expert cache + native MTP + fused hyper-connections + Q8_0 PLE table
  "strata_python":         "${env.L3MS_ROOT}/vendor/strata/.venv/bin/python"
  "strata_server":         "${env.L3MS_ROOT}/vendor/strata-lean/serve/server.py"
  "strata_ud_iq2_config":  "${env.L3MS_ROOT}/vendor/strata-lean/strata-ud-iq2_xs-ple_q8.json"
  "strata_abliterated_config":        "${env.L3MS_ROOT}/vendor/strata-lean/strata-sc117-iq3_xxs-ple_q8.json"
  "strata_vision_config":             "${env.L3MS_ROOT}/vendor/strata-lean/strata-vision-ple_q8.json"
  "strata_abliterated_vision_config": "${env.L3MS_ROOT}/vendor/strata-lean/strata-sc117-vision-ple_q8.json"
  # humanizer: master binary with full Gemma 4 support & jinja chat template
  "humanizer_server":      "${env.L3MS_ROOT}/vendor/llama.cpp-master/build/bin/llama-server"
  # master binary (b12621+): Nemotron 3.5 Bolt (nemotron_h_moe + DFlash) & general latest mainline models
  "llama_master_server":   "${env.L3MS_ROOT}/vendor/llama.cpp-master/build/bin/llama-server"
  # inkling2: custom lean Ada sm_89 llama.cpp build (fallback) + PolyStrata strata-poly (primary, 256k elastic)
  "inkling2_server":            "${env.L3MS_ROOT}/vendor/llama.cpp-inkling2-lean/build/bin/llama-server"
  "polystrata_server":          "${env.L3MS_ROOT}/vendor/polystrata/terminal/serve/server.py"
  "polystrata_inkling2_config": "${env.L3MS_ROOT}/vendor/polystrata/polystrata-inkling2-256k.json"

  # media engines owned by llama-swap (reserved model ids audiocpp_auto / comfyui_auto)
  "audiocpp_server":       "${env.L3MS_ROOT}/vendor/audio.cpp-955c872/build/bin/audiocpp_server"
  "speech_cpp_server":     "${env.HOME}/.local/share/lytte-nemotron/runtime/speech"
  "comfy_root":            "${env.L3MS_ROOT}"

  # --- Alder Lake CPU pinning (i5-12600K: 6P/12T on 0-11, 4E on 12-15) ---
  "cpu_range": "0-11"
  "ecores":    "12-15"

models:

  # ===========================================================================
  # Co-Resident CPU/E-Core Utilities
  # Runs alongside whatever burst model occupies the RTX 4070 without evicting it.
  # ===========================================================================

  "embeddinggemma-2":
    name: "EmbeddingGemma 2 (Q8_0, CPU E-cores, 768 dimensions)"
    description: "OpenAI-compatible embeddings for Lytte search by meaning. CPU-only and pinned to E-cores (12-15) in the non-exclusive co-resident group so it never evicts or contends with a burst model in VRAM; unloads after 5 minutes idle."
    ttl: 300
    metadata:
      task: embeddings
      dimensions: 768
      context_length: 2048
      query_prefix: "task: search result | query: "
      document_prefix: "title: none | text: "
    cmd: |
      env CUDA_VISIBLE_DEVICES= taskset -c ${ecores} ${qwen38_master_server}
      -m /home/kchauhan/models/ggml-org/embeddinggemma-2-GGUF/embeddinggemma-2-Q8_0.gguf
      --alias embeddinggemma-2
      --embedding
      --ctx-size 2048
      --batch-size 2048 --ubatch-size 2048
      --n-gpu-layers 0
      --parallel 2
      --threads 4
      --host 0.0.0.0 --port ${PORT}
      --no-warmup

  # ===========================================================================
  # Primary Local Burst — Language & Vision
  # Mutually exclusive on RTX 4070 12 GB (fixed port ${inference_port} = 8089).
  # ===========================================================================

  "qwen38-flash-next-plat":
    name: "Qwen3.8-Flash-Next Plat (Strata Lean, Unsloth UD-IQ2_XS, Q8_0 PLE, 128k ctx, 73.0 t/s)"
    description: "Platinum: strata-lean with Unsloth Dynamic UD-IQ2_XS + dynamic expert VRAM caching + unquantized Q8_0 PLE n-gram table (54.4 GB on NVMe, 0 MiB VRAM overhead) + native MTP speculative decoding (Q2_0 draft head) + K8V4 KV cache + 128k --kv-grow context + 4-slot conversation cache (73.0 t/s steady decode, 1,136-1,888 t/s prefill)."
    aliases:
      - "strata"
      - "plat"
      - "qwen38-flash-next-plat-ud-iq2"
      - "qwen38-flash-next-plat-ple-q8"
      - "plat-q8"
    ttl: 3600
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${strata_server}
      --engine strata
      --config ${strata_ud_iq2_config}
      --fit-max-tokens
      --host 0.0.0.0
      --port ${inference_port}

  "qwen38-flash-next-plat-vision":
    name: "Qwen3.8-Flash-Next Plat Vision (Strata Lean + strata-vision, Unsloth UD-IQ2_XS, Q8_0 PLE, mmproj-F16, 128k ctx)"
    description: "Platinum Vision: strata-lean with Unsloth UD-IQ2_XS + native CPU-offloaded strata-vision image encoder (mmproj-F16) + full Q8_0 PLE table preserving 100% VRAM expert cache. Multimodal image understanding via OpenAI / Anthropic API."
    aliases:
      - "strata-vision"
      - "plat-vision"
      - "qwen38-flash-next-plat-vision-iq4"
      - "plat-vision-iq4"
    ttl: 3600
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${strata_server}
      --engine strata
      --config ${strata_vision_config}
      --fit-max-tokens
      --host 0.0.0.0
      --port ${inference_port}

  "qwen38-flash-next-plat-abliterated":
    name: "Qwen3.8-Flash-Next Plat Abliterated (Strata Lean, SC117 IQ3_XXS, Q8_0 PLE, 128k ctx, 70-76 t/s)"
    description: "Platinum Abliterated: strata-lean with SC117 unaligned/uncensored weights + unquantized Q8_0 PLE n-gram table (54.4 GB on NVMe, 0 MiB VRAM overhead) + dynamic expert VRAM caching (3,086 hot experts in VRAM) + native MTP speculative decoding + K8V4 KV cache + 128k ctx + 4-slot conversation cache. 70-76 t/s steady decode."
    aliases:
      - "abliterated"
    ttl: 3600
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${strata_server}
      --engine strata
      --config ${strata_abliterated_config}
      --fit-max-tokens
      --host 0.0.0.0
      --port ${inference_port}

  "qwen38-flash-next-plat-abliterated-vision":
    name: "Qwen3.8-Flash-Next Plat Abliterated Vision (Strata Lean + strata-vision, mmproj-F16, SC117, Q8_0 PLE, 128k ctx)"
    description: "Platinum Abliterated Vision: strata-lean uncensored/unaligned SC117 weights with native CPU-offloaded strata-vision image encoder (mmproj-F16) + unquantized Q8_0 PLE table preserving 100% VRAM expert cache. Multimodal image understanding."
    aliases:
      - "abliterated-vision"
    ttl: 3600
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${strata_server}
      --engine strata
      --config ${strata_abliterated_vision_config}
      --fit-max-tokens
      --host 0.0.0.0
      --port ${inference_port}

  "inkling-2-mini":
    name: "Inkling 2 Mini 26.4B-A5.4B (PolyStrata, UD-Q4_K_XL + CPU Vision, 256k)"
    description: "Thinking Machines Lab 26.4B MoE (3.4B/5.4B looped active) coding, agentic & vision model. Runs on PolyStrata polystrata-4070 (v0.2.20-poly.5 + #313, Ada sm_89 + AVX-VNNI) with CUDA VMM elastic 256k FP8 KV pool (--vram-pool --loop-bf16 --prompt-batch 2048 --lock-experts --window 6 --lookup 3), Ada INT8 Tensor Core NVFP4 prefill (STRATA_PREFILL_NVFP4=w4a8, STRATA_INK_FAST_CTRL=1, STRATA_INK_PRESTAGE=0), ~1,681 resident GPU experts, zero-VRAM CPU strata-vision, and 4-slot conversation cache (77.5 t/s fresh / 99.7 t/s edits, 1,833 / 2,296 / 2,270 t/s pp2k/8k/20k, 11.70 GB peak VRAM; see docs/inkling-2-mini-optimization.md)."
    aliases:
      - "inkling-2-mini-128k"
    ttl: 3600
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${strata_python}
      ${polystrata_server}
      --engine strata
      --config ${polystrata_inkling2_config}
      --fit-max-tokens
      --host 0.0.0.0
      --port ${inference_port}

  "qwen3-8-27b-iq3-xxs":
    name: "Qwen3.8-27B UD-IQ3_XXS (pure-VRAM dense 27B, 262k ctx, 36.7 t/s)"
    description: "Dense 27B hybrid, 10.17 GiB. Pure-VRAM zero-DDR5-traffic language tier: holds 262k native ctx in 12 GB VRAM with q5_0/q4_1 KV at ~36.7 t/s. See docs/qwen3-8-27b-local-post.md. No MTP."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${llama_server}
      -m /home/kchauhan/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --alias "unsloth/Qwen3.8-27B UD-IQ3_XXS"
      --temp 1.0 --top-p 0.95 --top-k 20
      --presence-penalty 0.0 --repeat-penalty 1.0
      --host 0.0.0.0 --port ${inference_port}
      --jinja
      --ctx-size 262144 --n-predict 32768
      --fit on --fit-ctx 262144 --fit-target 128
      -ctk q5_0 -ctv q4_1
      --load-mode none
      --threads 10 --threads-batch 12
      --flash-attn on
      --parallel 1
      --batch-size 512 --ubatch-size 512
      --prio 2 --no-warmup

  # ===========================================================================
  # Fallback & Specialized Local LLMs
  # ===========================================================================

  "qwen38-flash-next":
    name: "Qwen3.8-Flash-Next (master b12073 d1044bc82, Unsloth UD-IQ2_XS + Q8_0 PLE, 96k ctx)"
    description: "Gold: plain upstream master b12073 (d1044bc82) on Unsloth UD-IQ2_XS + Q8_0 PLE. 96k ctx, q8 KV, ngram-mod spec. Natively includes PR #29761, #29824, #29825, #30480, #29181, #30239, #29887, #30602, #30927, #31188, #31243, #31443. Reasoning: effort=xhigh, budget=4000. See docs/qwen38-flash-next-internal.md."
    aliases:
      - "qwen38-flash-next-ple-q8"
      - "gold-q8"
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${qwen38_master_server}
      -m /home/kchauhan/models/unsloth/UD-IQ2_XS/Qwen3.8-Flash-Next-UD-IQ2_XS-00001-of-00003.gguf
      --alias Qwen3.8-Flash-Next
      --fit on --fit-target 512
      -c 98304 --parallel 1
      -b 4096 -ub 2048
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 60 --spec-ngram-mod-n-min 12 --spec-ngram-mod-n-max 24
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort xhigh --reasoning-budget -1 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "qwen38-flash-next-exp":
    name: "Qwen3.8-Flash-Next EXP (b12100 + MoE Cache #30966 + MTP Fix #30592, Unsloth UD-IQ2_XS)"
    description: "Experimental tier: llama.cpp b12100 with dynamic GPU MoE expert LRU caching (--moe-cache-mib 2048) + CPU-shared misses (#30966) + fused MoE MMQ on Unsloth UD-IQ2_XS + Q8_0 PLE. 65k ctx. See docs/qwen38-flash-next-internal.md."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${qwen38_exp_server}
      -m /home/kchauhan/models/unsloth/UD-IQ2_XS/Qwen3.8-Flash-Next-UD-IQ2_XS-00001-of-00003.gguf
      --alias Qwen3.8-Flash-Next-Exp
      --fit on --fit-target 512
      -c 65536 --parallel 1
      -b 4096 -ub 1024
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --moe-cache-mib 2048
      --spec-type ngram-mod
      --spec-ngram-mod-n-match 60 --spec-ngram-mod-n-min 12 --spec-ngram-mod-n-max 24
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort xhigh --reasoning-budget 4000 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "qwen38-flash-next-mtp":
    name: "Qwen3.8-Flash-Next MTP (Unified QSA Sparsity V2 + PR #28243, shared-Q4_K_M, ncmoe 46)"
    description: "Speculative tier: Unified QSA Sparsity Stack V2 (#28770 + #28699 + #28213 + #29166) + PR #28243 with unsloth mtp-Qwen3.8-Flash-Next-shared-Q4_K_M.gguf (1.78 GB) + NVMe row prefetching (#29599). Offloads 2 MoE layers to GPU (-ncmoe 46), 97-100% draft acceptance (2.76-2.93 tok/step), 25.3-27.06 t/s decode, 11.0 GB VRAM. See docs/qwen38-flash-next-internal.md."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${qwen38_mtp_server}
      -m /home/kchauhan/models/unsloth/UD-IQ2_XS/Qwen3.8-Flash-Next-UD-IQ2_XS-00001-of-00003.gguf
      --spec-draft-model /home/kchauhan/models/unsloth/Qwen3.8-Flash-Next-GGUF/MTP/mtp-Qwen3.8-Flash-Next-shared-Q4_K_M.gguf
      --alias Qwen3.8-Flash-Next-MTP
      -ngl 99 -ncmoe 46
      -c 16384 --parallel 1
      -b 2048 -ub 512
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-p-min 0.7
      --spec-draft-ngl 99
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort xhigh --reasoning-budget -1 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "qwen38-flash-next-vision":
    name: "Qwen3.8-Flash-Next Vision (master b11619, mmproj-F16, 32k ctx, ncmoe 45)"
    description: "Multimodal tier: plain upstream master b11619 with mmproj-F16 vision projector on Unsloth UD-IQ2_XS + Q8_0 PLE. Offloads 3 MoE layers to GPU (-ncmoe 45), 18.2-18.6 t/s @ 32k ctx, ub 1024, 10.8 GB VRAM (1.32 GB headroom for image activations/KV). See docs/qwen38-flash-next-internal.md."
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${qwen38_master_server}
      -m /home/kchauhan/models/unsloth/UD-IQ2_XS/Qwen3.8-Flash-Next-UD-IQ2_XS-00001-of-00003.gguf
      --mmproj /home/kchauhan/models/unsloth/Qwen3.8-Flash-Next-GGUF/mmproj-F16.gguf
      --alias Qwen3.8-Flash-Next-Vision
      -ngl 99 -ncmoe 45
      -c 32768 --parallel 1
      -b 2048 -ub 1024
      -fa on --jinja
      -ctk q8_0 -ctv q8_0
      -t 10 --threads-batch 12 --prio 2
      --lazy-mode on
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --reasoning-effort xhigh --reasoning-budget 4000 --reasoning-preserve
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "inkling-2-mini-llama":
    name: "Inkling 2 Mini 26.4B-A5.4B (llama.cpp-inkling2-lean fallback, 32k)"
    description: "Fallback llama.cpp engine: custom Ada sm_89 llama.cpp-inkling2-lean with elastic borrowed-cache prefill (LLAMA_MOE_CACHE_ELASTIC=1), visit-weighted loop budget (LLAMA_MOE_CACHE_VISIT_BUDGET=1), PR #264 CUDA MoE prompt kernels, 7,800 MiB GPU MoE LRU cache (--moe-cache-cpu-share 0.70), DSpark n=3 (--spec-draft-n-ubatch 256), and CPU-offloaded mmproj (~68.7 tok/s steady decode, ~820 tok/s pp2k, ~726 tok/s pp8k, 11.65 GB peak VRAM)."
    env:
      - "LLAMA_MOE_CACHE_ELASTIC=1"
      - "LLAMA_MOE_CACHE_VISIT_BUDGET=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${inkling2_server}
      -m /mnt/dev/models/unsloth/Inkling-2-Mini-GGUF/Inkling-2-Mini-UD-Q4_K_XL.gguf
      --mmproj /mnt/dev/models/unsloth/Inkling-2-Mini-GGUF/mmproj-F16.gguf
      --no-mmproj-offload
      --spec-draft-model /mnt/dev/models/unsloth/Inkling-2-Mini-GGUF/dspark-Inkling-2-Mini-Q8_0.gguf
      --spec-type draft-dspark --spec-draft-n-max 3 --spec-draft-ngl 99 --spec-draft-n-ubatch 256
      --alias inkling-2-mini-llama
      --jinja --flash-attn on
      -c 32768 --parallel 1
      -ngl 99 --fit off --load-mode none
      -cmoe --moe-cache-mib 7800 --moe-cache-cpu-share 0.70
      -ot "token_embd\.weight=CPU"
      -ctk q8_0 -ctv q8_0
      --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0.0
      --batch-size 2048 --ubatch-size 2048
      --threads 12 --threads-batch 12 --prio 2
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  # Inkling 2 Mini 26.4B-A5.4B — Unbound v2.1 (abliterated; non-startup profile).
  # Sampling per model card: temp 0.6 / top_p 0.95 (thinking cap 4,096 is client-side max_tokens). No DRY.
  "inkling-2-mini-unbound-v2.1":
    name: "Inkling 2 Mini 26.4B-A5.4B (Unbound v2.1 Q4_K_M, llama.cpp-inkling2-lean, 32k)"
    description: "nokeepai Unbound v2.1 (conv-aware abliterated + self-distilled attention-patched GGUF). GGUF Q4_K_M 17.78 GB at /mnt/dev/models/nokeepai/Inkling-2-Mini-Unbound-GGUF, CPU-offloaded mmproj-F16 (same projector as the original). Non-startup profile: wake it explicitly. Sampling temp 0.6 / top_p 0.95, no DRY. Not yet benchmarked on this stack."
    env:
      - "LLAMA_MOE_CACHE_ELASTIC=1"
      - "LLAMA_MOE_CACHE_VISIT_BUDGET=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${inkling2_server}
      -m /mnt/dev/models/nokeepai/Inkling-2-Mini-Unbound-GGUF/Inkling-2-Mini-Unbound-v2.1-Q4_K_M.gguf
      --mmproj /mnt/dev/models/unsloth/Inkling-2-Mini-GGUF/mmproj-F16.gguf
      --no-mmproj-offload
      --alias inkling-2-mini-unbound-v2.1
      --jinja --flash-attn on
      -c 32768 --parallel 1
      -ngl 99 --fit off --load-mode none
      -cmoe --moe-cache-mib 7800 --moe-cache-cpu-share 0.70
      -ot "token_embd\.weight=CPU"
      -ctk q8_0 -ctv q8_0
      --temp 0.6 --top-p 0.95 --top-k 0 --min-p 0.0
      --batch-size 2048 --ubatch-size 2048
      --threads 12 --threads-batch 12 --prio 2
      --no-warmup
      --host 0.0.0.0 --port ${inference_port}

  "gemma-4-26b-qat":
    name: "gemma-4-26B QAT (UD-Q4_K_XL, text, 131k ctx)"
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${llama_server}
      -m /home/kchauhan/models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --alias "unsloth/gemma-4-26B-A4B QAT (UD-Q4_K_XL)"
      --seed 3407
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0 --repeat-penalty 1.0
      --host 0.0.0.0 --port ${inference_port}
      --jinja
      --ctx-size 131072
      --fit on --fit-ctx 131072 --fit-target 512
      --parallel 1
      -ctk q8_0 -ctv q8_0
      --load-mode mlock
      --threads 10 --threads-batch 12 --flash-attn on
      --batch-size 1024 --ubatch-size 512
      --prio 2 --no-warmup

  "gemma-4-26b-qat-mtp":
    name: "gemma-4-26B QAT + MTP (UD-Q4_K_XL + Assistant, 131k ctx)"
    env:
      - "GGML_CUDA_GRAPH_OPT=1"
    proxy: http://127.0.0.1:${inference_port}
    cmd: |
      taskset -c ${cpu_range} ${llama_server}
