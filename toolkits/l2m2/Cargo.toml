[package]
name = "l2m2"
version = "0.1.0"
edition = "2021"
description = "Local Latent Media Machine: script-first image, audio and video tooling"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"

[dev-dependencies]
tempfile = "3"
