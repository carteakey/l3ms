[package]
name = "l3ds"
version = "0.1.0"
edition = "2021"
description = "Local Low-latency Decision System: script-first decision model tooling & benchmarks"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
